name: GRIT ENGINE ZX V1.1 - seis perfiles
on:
  push:
    branches: [main, 'develop/v1.1-escoria']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python grit.py import Escoria-Sideral
      - run: python grit.py demo6
      - run: python demo/technology_demo_v11/build.py
      - run: python demo/technology_demo_v11/test_switch.py
      - run: echo "82036bb66376e3465ed91e7ab0d973cd429a39d0c5a528c5b0a153ef72dc7032  demo/technology_demo_v11/GRIT_ENGINE_TECH_DEMO_V1.1.tap" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: GRIT_ENGINE_TECH_DEMO_V1.1
          path: demo/technology_demo_v11/GRIT_ENGINE_TECH_DEMO_V1.1.tap
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GRIT_ENGINE_TECH_DEMO_V1.1
          path: release
      - name: Publicar única edición vigente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(cat VERSION)" = "1.1"
          echo "82036bb66376e3465ed91e7ab0d973cd429a39d0c5a528c5b0a153ef72dc7032  release/GRIT_ENGINE_TECH_DEMO_V1.1.tap" | sha256sum -c -
          if gh release view v1.1 >/dev/null 2>&1; then
            echo "La release v1.1 ya existe; no se sobrescribe."
            exit 0
          fi
          mkdir -p staging/GRIT_ENGINE_ZX_V1.1
          git archive HEAD | tar -x -C staging/GRIT_ENGINE_ZX_V1.1
          cp release/GRIT_ENGINE_TECH_DEMO_V1.1.tap staging/GRIT_ENGINE_ZX_V1.1/
          (cd staging && zip -qr ../release/GRIT_ENGINE_ZX_V1.1_COMPLETO.zip GRIT_ENGINE_ZX_V1.1)
          gh release create v1.1 release/GRIT_ENGINE_TECH_DEMO_V1.1.tap release/GRIT_ENGINE_ZX_V1.1_COMPLETO.zip --target "$GITHUB_SHA" --title "GRIT ENGINE ZX V1.1 — ZX Spectrum 48K" --notes-file RELEASE_NOTES.md --latest
